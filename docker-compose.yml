# Local development: API + router + frontend, one command.
#
#   scripts/graphhopper.sh setup --region-set demo    # once, ~4 minutes
#   scripts/publish_graph.sh --local                  # stage it for the build
#   docker compose up
#
# This is also the thing that proves Phase 1.1 is fixed. The API reaches the
# router at http://graphhopper:8989 — a **hostname**, not localhost — so the
# old hostname sniff would resolve self_hosted=False here and silently drop the
# smoothness hard constraint. MEANDER_GRAPHHOPPER_SELF_HOSTED=1 below is the
# fix, and /api/health reports `self_hosted_source: "env"` to prove it was
# configured rather than guessed.

services:
  graphhopper:
    build:
      context: .
      dockerfile: graphhopper/Dockerfile
      args:
        GRAPH_SOURCE: local
    environment:
      GH_HEAP: ${GH_HEAP:-3g}
    # Not published to the host by default. The router is unauthenticated and
    # compute-unbounded; in production it lives in a private subnet with no
    # public ingress at all, and there is no reason for local development to be
    # laxer. Uncomment to poke at it directly.
    # ports:
    #   - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8990/healthcheck"]
      interval: 10s
      timeout: 5s
      # The graph is loaded into RAM at boot; measured at 1.1 s for the demo
      # set, but a cold page cache on a fresh container is slower.
      start_period: 120s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      graphhopper:
        condition: service_healthy
    environment:
      MEANDER_GRAPHHOPPER_URL: http://graphhopper:8989/route
      # The point of this file. See the header.
      MEANDER_GRAPHHOPPER_SELF_HOSTED: "1"
      MEANDER_FIXTURES: live
      # ⚠ Both of the next two are laptop settings, and this is the file most
      # likely to be copied onto a server. This is the pair to change when it is.
      #
      # MEANDER_FIXTURES=live means the API no longer adds the dev server to the
      # allowlist by itself (see _resolve_origins in backend/config.py), so a
      # compose stack serving a Vite frontend has to ask for it. That is what
      # these two lines do, and it is the reason they are safe here and wrong in
      # production.
      #
      # On a public host: MEANDER_ALLOWED_ORIGINS becomes the real site origin
      # and MEANDER_ALLOW_LOCAL_ORIGINS becomes 0.
      MEANDER_ALLOWED_ORIGINS: http://localhost:5173
      MEANDER_ALLOW_LOCAL_ORIGINS: "1"
      # 0, not 1: nothing is in front of the API here. Set it to 1 behind an
      # ALB, or every client shares one rate-limit bucket.
      MEANDER_TRUSTED_PROXY_HOPS: "0"
      MEANDER_LOG_LEVEL: INFO
      GRAPHHOPPER_KEY: ${GRAPHHOPPER_KEY:-}
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite proxies /api to this. Same-origin from the browser's point of
      # view, so no CORS in local development.
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  frontend_node_modules:
