AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Meander network. One VPC, public subnets for the load balancer, private
  subnets for both services, and the security groups that make the router
  unreachable from the internet by construction rather than by configuration.

# ---------------------------------------------------------------------------
# NOTHING IN infra/ HAS BEEN APPLIED. See infra/README.md.
#
# Every template here validates (`aws cloudformation validate-template`, a
# read-only call) and none has been deployed. A template that parses is not a
# template that works; treat every claim about runtime behaviour as UNVERIFIED
# until the commands in infra/README.md have actually been run.
# ---------------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: meander
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  CloudFrontPrefixListId:
    Type: String
    Description: >
      AWS-managed prefix list for CloudFront's origin-facing ranges, which is
      region-specific and has no CloudFormation lookup. Find it with:
        aws ec2 describe-managed-prefix-lists --region <region> \
          --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
          --query 'PrefixLists[0].PrefixListId' --output text
    AllowedPattern: '^pl-[0-9a-f]+$'

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true   # required for Cloud Map / private DNS
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-igw' }]

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Two AZs because an ALB requires at least two subnets in different ones.
  # Not three: the third adds a second NAT gateway's worth of temptation and
  # buys nothing at this size.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-a' }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-b' }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-a' }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-b' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public' }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # ONE NAT gateway, and it is the second-largest line on the bill after
  # Fargate — about $32/month before data processing. Two would be
  # AZ-redundant; at this size the honest trade is that losing an AZ means an
  # outage rather than a doubled standing cost. DEPLOY.md says so plainly
  # rather than leaving it as an implied guarantee.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties: { Domain: vpc }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nat' }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private' }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # Free, and it takes ECR layer pulls and the router's graph download off the
  # NAT's metered path. ECR stores layers in S3, so this is most of the image
  # pull traffic. The interface endpoints for ECR/logs/secrets would take the
  # rest but cost about $7/month each per AZ — more than the NAT data they
  # save at this volume, which is why they are not here.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # --- security groups ----------------------------------------------------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Only CloudFront's origin-facing ranges, not 0.0.0.0/0. AWS publishes
        # them as a managed prefix list, so this stays correct as they change.
        # Without it the ALB is a second public entrance that bypasses every
        # CloudFront-level control, and nothing would ever tell you.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing ranges
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-alb' }]

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From the load balancer only
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-api' }]

  # **The router has no ingress rule from anywhere but the API.** This is the
  # security boundary named in graphhopper/Dockerfile: the container binds
  # 0.0.0.0 because a container that binds 127.0.0.1 is unreachable even by its
  # own health check, so the bind address is not the control. This is.
  #
  # GraphHopper is unauthenticated and compute-unbounded. A single
  # `?algorithm=round_trip` against a large graph will occupy a core for
  # seconds, and there is no key, quota or rate limit in front of it.
  RouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GraphHopper. Reachable only from the API tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8989
          ToPort: 8989
          SourceSecurityGroupId: !Ref ApiSecurityGroup
          Description: Routing, from the API tasks only
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-router' }]

  # Port 8990 is deliberately absent from that list. The admin connector answers
  # the container's own health check over 127.0.0.1 and must not be reachable
  # across the network at all.

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${AWS::StackName}-VpcId' }
  PublicSubnets:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub '${AWS::StackName}-PublicSubnets' }
  PrivateSubnets:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub '${AWS::StackName}-PrivateSubnets' }
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-AlbSg' }
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-ApiSg' }
  RouterSecurityGroupId:
    Value: !Ref RouterSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-RouterSg' }
