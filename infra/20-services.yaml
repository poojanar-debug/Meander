AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Meander services. ECS Fargate on Graviton: the router in a private subnet
  reachable only by the API, the API behind an internet-facing load balancer
  that admits only CloudFront, and the alarms that would tell you either has
  stopped being true.

# NOTHING IN infra/ HAS BEEN APPLIED. See infra/README.md.
#
# ECS Fargate rather than App Runner, which is closed to new customers, and
# rather than Lambda, which cannot hold a 1.2 GB routing graph in memory across
# invocations — the whole reason self-hosting was worth doing.

Parameters:
  ProjectName: { Type: String, Default: meander }
  NetworkStack: { Type: String, Default: meander-network }
  PlatformStack: { Type: String, Default: meander-platform }
  ApiImage:
    Type: String
    Description: Full ECR image URI including an immutable tag (never :latest).
  RouterImage:
    Type: String
    Description: Full ECR image URI including an immutable tag.
  AlbCertificateArn:
    Type: String
    Default: ''
    Description: >
      Regional ACM certificate for the load balancer. Leave empty and the
      listener is plain HTTP — see the comment on ApiListener before doing so.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Where alarms go. Empty means the alarms exist and notify nobody.
  CorsOrigins:
    Type: String
    Default: 'capacitor://localhost'
    Description: >
      Comma-separated Origin allowlist for the API, verbatim and with no
      trailing slashes. Defaults to the iOS app's origin.

      Leaving this EMPTY does not deny everything — backend/config.py defaults
      MEANDER_ALLOW_LOCAL_ORIGINS to "no origins were configured", so an empty
      value allowlists http://localhost:5173 and http://127.0.0.1:5173. That is
      right for a workstation and wrong for a deployed task, which is why this
      parameter has a default rather than being optional.

      The website needs no entry here: CloudFront serves the SPA and proxies
      /api/* from one distribution, so the web app is same-origin. The app is
      not — it serves its own assets from capacitor://localhost and calls the
      distribution over HTTPS, which is cross-origin by any definition.
  RouterCpu: { Type: String, Default: '1024' }
  RouterMemory: { Type: String, Default: '4096' }
  ApiCpu: { Type: String, Default: '512' }
  ApiMemory: { Type: String, Default: '1024' }
  ApiDesiredCount: { Type: Number, Default: 2 }
  LogRetentionDays: { Type: Number, Default: 30 }

Conditions:
  HasAlbCertificate: !Not [!Equals [!Ref AlbCertificateArn, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  # Private DNS so the API can reach the router by name. The alternative — a
  # second load balancer in front of the router — costs another $16/month and
  # adds a public-ish surface to the component that most needs none.
  ServiceNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${ProjectName}.internal'
      Vpc: { 'Fn::ImportValue': !Sub '${NetworkStack}-VpcId' }

  RouterDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: graphhopper
      NamespaceId: !GetAtt ServiceNamespace.Id
      DnsConfig:
        DnsRecords: [{ Type: A, TTL: 10 }]
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig: { FailureThreshold: 1 }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/api'
      RetentionInDays: !Ref LogRetentionDays

  RouterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/graphhopper'
      RetentionInDays: !Ref LogRetentionDays

  # --- roles --------------------------------------------------------------

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-task-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: { 'Fn::ImportValue': !Sub '${PlatformStack}-SecretsArn' }

  # Deliberately empty of AWS permissions. The API talks to the router, to
  # Overpass and Open-Meteo, and to nothing in this account — it reads its
  # pre-warmed scores from a SQLite file baked into the image. A task role with
  # nothing in it is the accurate description of that, and it makes any future
  # AWS call fail loudly rather than inherit an ambient permission.
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-api-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  RouterTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-router-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # --- the router ---------------------------------------------------------

  RouterTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-graphhopper'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref RouterCpu
      Memory: !Ref RouterMemory
      RuntimePlatform:
        CpuArchitecture: ARM64        # Graviton: ~20% cheaper for the same vCPU
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RouterTaskRole.Arn
      ContainerDefinitions:
        - Name: graphhopper
          Image: !Ref RouterImage
          Essential: true
          PortMappings: [{ ContainerPort: 8989, Protocol: tcp }]
          Environment:
            # 3g against a 4096 MiB task. The JVM needs headroom above -Xmx for
            # metaspace, thread stacks and the direct buffers GraphHopper uses
            # to mmap the graph; setting -Xmx to the whole task memory is how
            # you get an ECS OOM kill rather than a Java OutOfMemoryError, and
            # the OOM kill tells you nothing. PROGRESS.md phase 3 records an
            # 8 GB heap dying against a 6.6 GB graph *after* a 31-minute import.
            - { Name: GH_HEAP, Value: 3g }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RouterLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: graphhopper
          HealthCheck:
            # The admin connector, which answers without touching the router.
            Command: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8990/healthcheck || exit 1']
            Interval: 15
            Timeout: 5
            Retries: 4
            # The graph is read into memory at boot. Measured at 1.1 s for the
            # demo set on a warm laptop; a cold container is slower, and a task
            # killed for failing its health check during a normal start is an
            # infinite crash loop that looks like a broken image.
            StartPeriod: 180

  RouterService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-graphhopper'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref RouterTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      # No load balancer and **no public IP**. Private subnets, and a security
      # group whose only ingress rule names the API's security group.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets' }]
          SecurityGroups: [{ 'Fn::ImportValue': !Sub '${NetworkStack}-RouterSg' }]
      ServiceRegistries:
        - RegistryArn: !GetAtt RouterDiscovery.Arn
      # One task, and replacing it is a brief outage rather than a rolling
      # update: two tasks would double the largest line on the bill to hold a
      # read-only graph, and the API degrades to an error rather than a wrong
      # answer while it restarts.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100

  # --- the API ------------------------------------------------------------

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          Environment:
            - Name: MEANDER_GRAPHHOPPER_URL
              Value: !Sub 'http://graphhopper.${ProjectName}.internal:8989/route'

            # **Both of the next two are load-bearing and neither fails loudly.**
            #
            # SELF_HOSTED=1: four behaviours hang off this flag and the
            # dangerous one is that path_details() drops `smoothness`, so the
            # accessible custom model silently stops excluding surfaces
            # recorded as impassable. The old hostname sniff resolves the
            # Cloud Map name above to *not* self-hosted. /api/health reports
            # `self_hosted_source` so you can see it was configured rather than
            # guessed.
            - { Name: MEANDER_GRAPHHOPPER_SELF_HOSTED, Value: '1' }

            # TRUSTED_PROXY_HOPS=2, not 1. The rate limiter reads
            # X-Forwarded-For from the right, `parts[-hops]`. CloudFront sets
            # XFF to the viewer's address; the ALB then appends CloudFront's.
            # The header the app sees is `viewer, cloudfront`, so the viewer is
            # the second from the right. With 1 every request in the world maps
            # to one CloudFront edge IP and therefore one rate-limit bucket —
            # the limiter still *works*, which is what makes it hard to spot,
            # it just limits everybody together.
            #
            # If you ever put the ALB in front without CloudFront, this is 1.
            # That mismatch is a reason on its own to keep the ALB's security
            # group restricted to CloudFront's ranges.
            - { Name: MEANDER_TRUSTED_PROXY_HOPS, Value: '2' }

            - { Name: MEANDER_FIXTURES, Value: live }
            - { Name: MEANDER_STRICT_STARTUP, Value: '1' }
            - { Name: MEANDER_LOG_LEVEL, Value: INFO }
            # The website is same-origin — CloudFront serves the SPA and /api/*
            # from one distribution — and this used to be '' for that reason.
            #
            # ⚠ '' was never an empty allowlist. config.py:322 reads
            # _env_flag("MEANDER_ALLOW_LOCAL_ORIGINS", not origins), so with
            # nothing configured the default is *on* and the deployed task
            # allowlisted the Vite dev server: a page on a developer's laptop
            # could call production, and nothing anywhere said so.
            #
            # Setting this closes that as a side effect of the list becoming
            # non-empty. test_client_ip_and_cors.py pins both halves, because a
            # side effect is exactly what gets refactored away by someone
            # tidying the conditional.
            - { Name: MEANDER_ALLOWED_ORIGINS, Value: !Ref CorsOrigins }
            # Overpass's tail is 13.6 s (PROGRESS.md, launch phase 0). The old
            # 12 s default silently timed rest stops into null some fraction of
            # the time — honest, because null means "we could not look", but
            # quietly absent.
            - { Name: MEANDER_HTTP_TIMEOUT_S, Value: '20' }
            # NOT SET, on purpose: MEANDER_CACHE_DB. Overriding it points the
            # API away from the data/cache.db baked into the image, which holds
            # every pre-warmed CLIP score. Nothing breaks — every route just
            # quietly drops to geometry_only. Phase K found this in render.yaml.
          Secrets:
            - Name: MAPILLARY_TOKEN
              ValueFrom: !Sub
                - '${Arn}:MAPILLARY_TOKEN::'
                - Arn: { 'Fn::ImportValue': !Sub '${PlatformStack}-SecretsArn' }
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub
                - '${Arn}:ANTHROPIC_API_KEY::'
                - Arn: { 'Fn::ImportValue': !Sub '${PlatformStack}-SecretsArn' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            # /healthz — liveness. Deliberately not /readyz: readiness goes 503
            # when the router is unreachable, and killing every API task
            # because the router is restarting turns one outage into two.
            Command: [CMD-SHELL, "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 30

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [ApiListener]
    Properties:
      ServiceName: !Sub '${ProjectName}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED   # reaches the internet through the NAT
          Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${NetworkStack}-PrivateSubnets' }]
          SecurityGroups: [{ 'Fn::ImportValue': !Sub '${NetworkStack}-ApiSg' }]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # --- load balancer ------------------------------------------------------

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${NetworkStack}-PublicSubnets' }]
      SecurityGroups: [{ 'Fn::ImportValue': !Sub '${NetworkStack}-AlbSg' }]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-api'
      VpcId: { 'Fn::ImportValue': !Sub '${NetworkStack}-VpcId' }
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      # /readyz here, unlike the container health check. This one decides
      # whether to send *traffic*, and a task that cannot reach the router
      # cannot answer — it should leave the pool without being killed.
      HealthCheckPath: /readyz
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        # Longer than the default 300 s: /api/routes is a stream that stays
        # open while enrichment runs, and draining a task mid-stream cuts the
        # response off at the client.
        - { Key: deregistration_delay.timeout_seconds, Value: '60' }
        - { Key: stickiness.enabled, Value: 'false' }

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      # HTTPS when a certificate is supplied, HTTP when not.
      #
      # ⚠ The HTTP path is not "insecure only in theory". CloudFront reaches
      # this load balancer across the public internet, so without a certificate
      # every request and response between them travels in clear text — and
      # this application's requests contain the user's coordinates, which is
      # the one thing it promises to protect. The empty default exists so the
      # stack is deployable in an account with no certificate, not because it
      # is an acceptable place to stop. infra/README.md gives the command to
      # request one.
      Port: !If [HasAlbCertificate, 443, 80]
      Protocol: !If [HasAlbCertificate, HTTPS, HTTP]
      Certificates: !If
        - HasAlbCertificate
        - [{ CertificateArn: !Ref AlbCertificateArn }]
        - !Ref AWS::NoValue
      SslPolicy: !If [HasAlbCertificate, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # --- alarms -------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alarms'

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The one that matters most. The router has no load balancer and no public
  # surface, so if it stops there is nothing outside the VPC to notice — the
  # API keeps answering, every route comes back as an error, and the site looks
  # up from the outside.
  RouterDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-router-not-running'
      AlarmDescription: >
        GraphHopper has no running task. Every route request is failing.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !Sub '${ProjectName}-graphhopper' }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]

  ApiUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-unhealthy-hosts'
      AlarmDescription: An API task is failing /readyz and taking no traffic.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-5xx'
      AlarmDescription: >
        The API is returning 5xx. Note this counts *target* 5xx only: the app
        degrades rather than failing, so a broken enrichment upstream shows up
        as null fields in a 200, not here.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-api-latency-p95'
      AlarmDescription: >
        p95 above 15 s. Sized from the measurement, not from a round number:
        routing is 24 ms and Overpass's tail is 13.6 s, so anything past this
        is not the shape of a normal slow request.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      ExtendedStatistic: p95
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
      Period: 300
      EvaluationPeriods: 2
      Threshold: 15
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export: { Name: !Sub '${AWS::StackName}-AlbDns' }
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub '${AWS::StackName}-Cluster' }
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export: { Name: !Sub '${AWS::StackName}-AlarmTopic' }
