name: ci

# There was no CI on `main` at all, so nothing checked the redesign pull
# request. This is the smallest workflow that makes the project's own claims
# verifiable rather than asserted — the standard CONTRIBUTING.md sets for
# everything else here.
#
# This file used to end by saying that `feat/launch` carried a larger version
# which would supersede it. That branch has now landed, and it did not: the two
# were reconciled rather than replaced, because most of what made the launch
# workflow larger was checking a frontend this branch does not have. The
# service-worker and headless-browser jobs are gone with the code they graded —
# there is no sw.js, no gate.mjs and no pwa-gate.mjs here. `infrastructure` is
# kept, because infra/ arrived in the same merge and cfn-lint is the only thing
# standing between a malformed template and finding out at deploy time.
#
# When the frontend gates are ported back — wired to this frontend rather than
# copied — their jobs come with them. Adding the jobs first would give five
# green checks that grade nothing.

# `push` is scoped to main rather than to '**', and that is the whole of the
# de-duplication. With `push: ['**']` alongside `pull_request`, every commit on
# a branch with an open PR ran the whole suite twice — verified on 6ad38c8,
# which produced one `push` run and one `pull_request` run of five jobs each.
# The concurrency group did not collapse them because the two events carry
# different refs: `refs/heads/<branch>` against `refs/pull/<n>/merge`.
#
# Scoping to main also tests the better commit. A `pull_request` run builds the
# branch already merged into its base, which is the thing that will actually
# land; a `push` run builds the branch head in isolation and can pass while the
# merge is broken.
#
# The trade is that a branch with no open PR gets no CI. That is the usual
# arrangement, and CONTRIBUTING.md already asks for the suite to be run before
# every commit.
on:
  push:
    branches: [main]
  pull_request:

# Keyed on the PR number where there is one, so all of a pull request's runs
# share a group and a new push cancels the run still in flight. Falling back to
# the ref keeps pushes to main grouped per branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      # requirements-dev.txt, not requirements.txt. The latter pulls 2.5 GB of
      # torch so that two CLIP tests can un-skip, and it is the *further*
      # environment from production, which has no torch either. Testing against
      # the deploy set means the suite exercises the same import graph the
      # deployed service has.
      - run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: python -m ruff check backend/ scripts/

      # Two branches adding the same function in different places is not a
      # conflict, so git merges it clean and the later definition silently wins.
      # 66eaef3 found three of these by hand; the fast-forward to feat/ios added
      # a fourth. Neither ruff nor the suite catches them — the shadowed copy is
      # usually a working implementation of the same thing.
      - name: No duplicate top-level definitions
        run: python scripts/check_duplicate_defs.py

      # No .env exists in CI — it is gitignored — so no API key is present and
      # every upstream call is served from a committed fixture. That is the
      # condition the suite is designed for.
      #
      # It is no longer the condition the suite *depends* on: the token-absence
      # test used to pass here and fail on any developer machine that had a
      # Mapillary token, and now supplies the absent token itself. BLOCKED.md #3
      # records why. This job would therefore catch the same regression even if
      # a runner somehow acquired one.
      - name: Tests, with the coverage floor
        # The floor lives in pyproject.toml so it is the same number here and on
        # a workstation. `make check` runs exactly this.
        run: python -m pytest backend/tests --cov --cov-report=term:skip-covered

  suite-opens-no-sockets:
    # conftest.py blocks sockets and a meta-test proves the guard is active, so
    # this is a second line of defence: if the guard were ever removed, the
    # suite would still pass on a machine with a network and would silently
    # start depending on it. Running with no network at all makes that
    # impossible to miss.
    #
    # The interpreter is resolved before sudo, because sudo's PATH is not the
    # runner's and a bare `python` would be a different one without the
    # dependencies installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: sudo unshare -n "$(command -v python)" -m pytest backend/tests -q

  deploy-image-is-torch-free:
    # The guarantee the whole 512 MB deployment rests on, checked against the
    # real requirements file rather than by reading it. Adding torch to
    # requirements-deploy.txt would OOM the instance at import time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -r backend/requirements-deploy.txt
      - name: torch, open_clip and torchvision must all be absent
        run: python scripts/check_torch_free.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend

      # TZ is pinned in vite.config.js, which is where it belongs — it has to
      # hold for a developer running `npm test` too, and it did not: two solar
      # tests inverted on a machine in Asia/Colombo while passing here, because
      # this line was the only thing setting it.
      #
      # Kept anyway. It costs nothing, it documents the dependency at the point
      # someone reads the workflow, and it means the job is still correct if the
      # config's test block is ever refactored away.
      - name: Tests
        run: npm test
        working-directory: frontend
        env:
          TZ: UTC

      - run: npm run build
        working-directory: frontend

      # The layout and accessibility gate. It drives the built app in headless
      # Chrome, which every ubuntu-latest runner already has, and it proves its
      # own selectors match something before it grades anything — the version
      # this replaced had four checks that found zero elements and passed, and
      # one whose pass value was the literal `true`.
      - name: Layout and accessibility gate
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          VITE_MOCK_API=1 npm run build
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/gate.mjs http://127.0.0.1:4173/

  no-hard-coded-colour:
    # DESIGN-HANDOFF §2 requires every colour to be declared once, in the two
    # :root blocks. That is a checkable property, so it is checked rather than
    # trusted — a stray hex in a component rule is exactly the kind of thing
    # that survives review and then breaks dark mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hex outside the token blocks
        run: bash scripts/check_palette.sh

  infrastructure:
    # Every template that describes the deployment must at least be
    # well-formed. This is a syntax check and nothing more — infra/README.md is
    # explicit that none of it has ever been applied, and a template that parses
    # is not a template that works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: CloudFormation templates parse
        # cfn-lint rather than `aws cloudformation validate-template`, which
        # needs credentials. It also catches more: unresolved !Ref targets,
        # unknown resource properties, and bad intrinsic function arguments.
        run: |
          python -m pip install cfn-lint
          cfn-lint infra/*.yaml
