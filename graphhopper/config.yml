# GraphHopper server configuration for Meander.
#
# Why self-host at all: the nature and accessible presets steer the router with
# a `custom_model`, custom models require flexible mode (`ch.disable: true`),
# and flexible mode is a paid feature of the hosted API — a free package answers
# "Free packages cannot use flexible mode". The open-source server has no such
# restriction, so both presets work here and nowhere else. See BLOCKED.md #0.
#
# Built by scripts/graphhopper.sh. Do not edit datareader.file by hand; the
# script writes the merged extract it builds.

graphhopper:
  datareader.file: data/meander-regions.osm.pbf
  graph.location: data/graph-cache

  # Only these three profiles exist, matching backend/models.py's EffectiveMode.
  # The *_elevation custom models make foot and bike prefer flatter ways, which
  # matters for a routing app whose accessible preset rejects gradients over 8%.
  profiles:
    - name: foot
      custom_model_files: [foot.json, foot_elevation.json]
    - name: bike
      custom_model_files: [bike.json, bike_elevation.json]
    - name: car
      custom_model_files: [car.json]

  # Contraction hierarchies: DELIBERATELY NOT PREPARED.
  #
  # CH is incompatible with a custom model, so it only ever served the `fastest`
  # preset — two of Meander's three presets could never use it. Measured on the
  # demo region set (620 MB with CH, 485 MB without):
  #
  #   |                          | with CH | without CH |
  #   |--------------------------|---------|------------|
  #   | import time              |    96 s |       58 s |
  #   | graph on disk            |  620 MB |     485 MB |
  #   | plain `fastest` route    |  5.1 ms |     9.2 ms |
  #   | flexible (nature/access) |  9.0 ms |     9.3 ms |
  #
  # So CH buys 4 ms on one preset and costs 22% of the graph and 40% of the
  # import. Graph size is what the memory bill is, and 4 ms is invisible next to
  # a request whose budget is dominated by Overpass at seconds. GraphHopper
  # falls back to LM automatically when no CH profile exists — verified, HTTP
  # 200 — so nothing in the app changes.
  #
  # It also removes a whole failure class: "algorithm=round_trip cannot be used
  # with CH" cannot occur if CH was never prepared. build_request_body() still
  # sets ch.disable for self-hosted round trips, which is now belt and braces
  # rather than load-bearing.
  #
  # ⚠ Measured on the demo graph only. The `countries` set is 18.5M nodes and
  # LM-only latency there is **not** measured; if you build countries and find
  # `fastest` slow, put this block back:
  #
  #   profiles_ch:
  #     - profile: foot
  #     - profile: bike
  #     - profile: car

  # Landmarks: what makes a *custom model* query fast. Without these, every
  # nature and accessible request falls back to plain Dijkstra over the whole
  # graph, which on a Great-Britain-sized extract takes seconds per request.
  # This is the preparation that makes self-hosting worth doing.
  profiles_lm:
    - profile: foot
    - profile: bike
    - profile: car

  # Every tag the custom models and Meander's accessibility engine read.
  #
  # `smoothness` is here specifically for accessibility.py: it is one of the
  # five hard constraints and the hosted API never exposed it, so that
  # constraint could not fire from routing data at all until now.
  #
  # `average_slope` and `max_slope` are what let the incline constraint be
  # checked against the router's own view rather than only against the
  # elevation profile.
  graph.encoded_values:
    road_class,
    road_class_link,
    road_environment,
    road_access,
    surface,
    smoothness,
    max_slope,
    average_slope,
    hike_rating,
    mtb_rating,
    foot_access,
    foot_priority,
    foot_average_speed,
    bike_access,
    bike_priority,
    bike_average_speed,
    car_access,
    car_average_speed,
    get_off_bike,
    roundabout,
    track_type,
    country,
    foot_road_access,
    bike_road_access

  # Elevation. Required for the *_elevation custom models above, for the slope
  # encoded values, and for Meander's own incline checks and elevation-variance
  # scoring. Cached so a rebuild does not re-download the tiles.
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: ./data/srtm
  graph.elevation.dataaccess: RAM_STORE

  # Import every highway type. GraphHopper requires this key to be set and its
  # own example excludes footway, cycleway, path and **steps** — sensible for a
  # car-only server, catastrophic here. Meander's single most important
  # accessibility check is "does this route contain steps"; if steps are never
  # imported, the graph cannot contain them, the check can never fire, and the
  # app would confidently report a staircase as step-free. footway, path and
  # cycleway are likewise the entire substance of the nature preset.
  import.osm.ignored_highways: ""

  # Round trips are an algorithm, not a profile, and work on any of the above.
  routing.non_ch.max_waypoint_distance: 1000000
  routing.max_visited_nodes: 1000000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1

logging:
  appenders:
    - type: console
      threshold: INFO
      time_zone: UTC
  loggers:
    com.graphhopper: INFO
